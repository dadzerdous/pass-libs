<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass-Libs</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="https://img.icons8.com/doodle/192/000000/pencil--v1.png">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen">
    <h1 class="studio-logo">Single Frame Games</h1>
    <p>Loading...</p>
</div>

    <div class="app-container">
        <h1 class="logo">Pass-Libs ✏️</h1>
        
        <div id="view-menu" class="fade-in">
            <div class="card">
                <h3>1. Who are you?</h3>
                <input type="text" id="player-name-input" placeholder="Your Name" spellcheck="false">
                
                <hr>

<h3>2. Start New Game</h3>
                <div class="select-wrapper">
                    <select id="player-count-select">
                        <option value="1">1 Player (Solo)</option>
                        <option value="2" selected>2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4">4 Players</option>
                    </select>
                </div>
                
                <div style="margin-bottom: 15px; text-align: left; padding-left: 10px;">
                    <label style="font-family: var(--font-head); font-size: 1.2rem;">
                        <input type="checkbox" id="public-check" style="width: auto; transform: scale(1.5); margin-right: 10px;">
                        Make Public Lobby?
                    </label>
                </div>

                <div class="button-row">
                    <button onclick="createGame('sfw')" class="btn-primary">New Game</button>
                    <button onclick="createGame('nsfw')" class="btn-danger">18+ Mode</button>
                </div>
                
                <hr>
                
                <h3>OR Join Game</h3>
                <div class="join-row">
                    <input type="text" id="room-code-input" placeholder="CODE">
                    <button onclick="joinGame()" class="btn-secondary">Join</button>
                </div>
                
                <button onclick="browseGames()" class="btn-primary" style="background-color: #f39c12; margin-top: 10px;">🔍 Browse Public Games</button>
                
                <div id="browser-area" class="hidden" style="margin-top: 15px;">
                    <h4>Open Lobbies:</h4>
                    <div id="public-games-list" class="grid-buttons" style="display: flex; flex-direction: column; gap: 10px;"></div>
                    <button onclick="closeBrowser()" class="btn-secondary" style="margin-top:10px; font-size: 0.8em;">Close List</button>
                </div>
            </div>
        </div>

        <div id="view-game" class="hidden fade-in">
            <h2 id="room-display" class="room-badge">Room: ????</h2>
            <div class="card game-card">
                <div id="lobby-area" class="hidden">
                    <h3>Waiting for Players...</h3>
                    <p id="player-status">1 / 2 Players Joined</p>
                    <div id="player-list"></div>
                    <button id="force-start-btn" onclick="forceStart()" class="btn-danger hidden">Start Now!</button>
                </div>

                <div id="gameplay-area" class="hidden">
                    <h3 id="prompt-display">Loading...</h3>
                    
                    <div id="input-area">
                        <input type="text" id="word-input" placeholder="TYPE HERE..." spellcheck="true" autocapitalize="characters">
                        <button onclick="submitWord()" class="btn-primary big-btn">SUBMIT</button>
                    </div>

                    <div id="voting-area" class="hidden">
                        <p class="instruction">Vote for the funniest:</p>
                        <div id="candidates-list" class="grid-buttons"></div>
                    </div>
                </div>

                <p id="wait-message" class="hidden pulse">Waiting...</p>
            </div>
        </div>

        <div id="view-result" class="hidden fade-in">
            <h2>The Story</h2>
            <div id="story-content" class="story-box paper-texture"></div>
            <div class="button-row">
                <button onclick="startReplay()" class="btn-primary">Play Again</button>
                <button onclick="location.reload()" class="btn-secondary">Exit</button>
            </div>
        </div>
        <footer>
        <p>Built by <a href="mailto:dadzerdous@gmail.com">Single Frame Games</a></p>
        <p style="font-size: 0.7em; opacity: 0.6;">v1.0 • <a href="#" onclick="alert('No ads, just fun. Enjoy!')">Support</a></p>
    </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
