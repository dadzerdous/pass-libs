<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass-Libs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <h1>Pass-Libs</h1>
        
        <div id="view-menu">
            <h3>1. Who are you?</h3>
            <input type="text" id="player-name-input" placeholder="Enter Your Name">
            
            <hr>

            <h3>2. Start New Game</h3>
            <label>Players:</label>
            <select id="player-count-select">
                <option value="1">1 Player</option>
                <option value="2" selected>2 Players</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
            </select>
            <br><br>
            <button onclick="createGame('sfw')" class="btn-primary">Create SFW Game</button>
            <button onclick="createGame('nsfw')" class="btn-danger">Create 18+ Game</button>
            
            <hr>
            
            <h3>OR Join Game</h3>
            <input type="text" id="room-code-input" placeholder="4-LETTER CODE">
            <button onclick="joinGame()" class="btn-secondary">Join Game</button>
        </div>

        <div id="view-game" class="hidden">
            <h2 id="room-display">Room: ????</h2>
            <div class="card">
                <h3 id="prompt-display">Loading...</h3>
                
                <div id="input-area">
                    <input type="text" id="word-input" placeholder="Type here...">
                    <button onclick="submitWord()" class="btn-primary">Submit</button>
                </div>

                <p id="wait-message" class="hidden">Waiting...</p>
            </div>
        </div>

        <div id="view-result" class="hidden">
            <h2>The Story</h2>
            <div id="story-content" class="story-box"></div>
            <button onclick="location.reload()" class="btn-secondary">Play Again</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
